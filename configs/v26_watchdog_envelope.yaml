{
  "watchdogs": [
    {
      "name": "Train Loss Explosion",
      "type": "threshold",
      "metric": "train_loss",
      "threshold": 1000000.0,
      "when": "gt"
    },
    {
      "name": "Grad Norm Blowup",
      "type": "threshold",
      "metric": "grad_norm",
      "threshold": 10000.0,
      "when": "gt"
    },
    {
      "name": "Val Overfit",
      "type": "threshold",
      "metric": "val_overfit_ratio",
      "threshold": 5.0,
      "when": "gt"
    },
    {
      "name": "critic_warmup_did_not_converge",
      "type": "sustained_phase",
      "metric": "phase",
      "value": 0,
      "max_steps": 1500000
    },
    {
      "name": "value_loss_increasing",
      "type": "threshold",
      "metric": "value_loss_slope",
      "threshold": 0.0,
      "when": "gt"
    },
    {
      "name": "episode_return_zero_variance",
      "type": "threshold",
      "metric": "episode_return_zero_variance",
      "threshold": 0.5,
      "when": "gt"
    },
    {
      "name": "explained_variance_stuck_negative",
      "type": "threshold",
      "metric": "explained_variance_stuck_negative",
      "threshold": 0.5,
      "when": "gt"
    },
    {
      "name": "arena_projection_saturation",
      "type": "threshold",
      "metric": "arena_projection_active_rate",
      "threshold": 0.5,
      "when": "gt",
      "severity": "warning",
      "sustained_steps": 100000
    }
  ]
}
